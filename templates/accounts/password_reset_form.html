{% extends "base.html" %}
{% block title %}Lupa Kata Sandi — TeFa Presensi{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:0 auto;">
  <p class="eyebrow">Atur ulang akses</p>
  <h1 style="font-size:1.5rem;">Lupa kata sandi?</h1>
  <p class="text-muted">Masukkan email akunmu. Kami akan mengirim tautan untuk membuat kata sandi baru.</p>
  <form method="post">
    {% csrf_token %}
    <label for="id_email">Email</label>
    <input type="email" name="email" id="id_email" autocomplete="email" required autofocus
           placeholder="nama@sekolah.sch.id">
    <button type="submit" class="btn btn--big">Kirim Tautan Reset</button>
  </form>
  <p class="text-muted" style="font-size:.85rem;margin-top:14px;"><a href="/accounts/login/">← Kembali ke masuk</a></p>
</div>
{% endblock %}
