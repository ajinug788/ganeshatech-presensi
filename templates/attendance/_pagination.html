{% if page_obj.has_other_pages %}
<nav class="pagination">
  {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}&q={{ q }}&group={{ group }}&status={{ status }}">« Sebelumnya</a>
  {% endif %}
  <span>Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}&q={{ q }}&group={{ group }}&status={{ status }}">Berikutnya »</a>
  {% endif %}
</nav>
{% endif %}
