{% extends "base.html" %}
{% block title %}Nonaktifkan Siswa{% endblock %}
{% block content %}
<section class="card" style="max-width:560px;margin:6vh auto;text-align:center">
  <span class="badge badge--tinjau">Konfirmasi</span>
  <h1 style="margin-top:14px">Nonaktifkan {{ object.full_name }}?</h1>
  <p class="text-muted">Siswa nonaktif tidak dapat melakukan absensi hingga diaktifkan kembali.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions" style="justify-content:center">
      <button class="btn btn--danger" type="submit">Ya, nonaktifkan</button>
      <a class="btn btn--secondary" href="{% url 'attendance:student_list' %}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
