{% extends "base.html" %}
{% block title %}Nonaktifkan Lokasi{% endblock %}
{% block content %}
<section class="card" style="max-width:560px;margin:6vh auto;text-align:center">
  <span class="badge badge--tinjau">Konfirmasi</span>
  <h1 style="margin-top:14px">Nonaktifkan {{ object.name }}?</h1>
  <p class="text-muted">Lokasi yang dinonaktifkan tidak lagi dipakai untuk validasi absensi.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions" style="justify-content:center">
      <button class="btn btn--danger" type="submit">Ya, nonaktifkan</button>
      <a class="btn btn--secondary" href="{% url 'attendance:location_list' %}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
