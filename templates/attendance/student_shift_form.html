{% extends "base.html" %}
{% block title %}Shift Siswa{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Manajemen</p><h1>Shift {{ object.full_name }}</h1></div><a class="btn btn--secondary" href="{% url 'attendance:student_detail' object.pk %}">← Kembali</a></div>
<section class="card" style="max-width:640px">
  <p>Shift sekarang: <strong>{{ object.shift.name|default:"(tanpa shift — kebijakan organisasi berlaku)" }}</strong></p>
  <form method="post">
    {% csrf_token %}
    {{ shift_form.as_p }}
    <div class="form-actions">
      <button class="btn" type="submit">Simpan</button>
      <a class="btn btn--secondary" href="{% url 'attendance:student_detail' object.pk %}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
