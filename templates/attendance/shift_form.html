{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Ubah{% else %}Tambah{% endif %} Shift{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Multi-shift</p><h1>{% if form.instance.pk %}Ubah{% else %}Tambah{% endif %} Shift</h1></div><a class="btn btn--secondary" href="{% url 'attendance:shift_list' %}">← Kembali</a></div>
<section class="card" style="max-width:640px">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn" type="submit">Simpan</button>
      <a class="btn btn--secondary" href="{% url 'attendance:shift_list' %}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
